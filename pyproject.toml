[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speechcortex-sdk"
description = "The official Python SDK for SpeechCortex ASR platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SpeechCortex Team", email = "team@speechcortex.com" },
]
keywords = ["speechcortex", "asr", "speech-to-text", "speech recognition"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25.2",
    "websockets>=12.0",
    "typing-extensions>=4.9.0",
]
dynamic = ["version"]

[project.optional-dependencies]
microphone = ["pyaudio"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/speechcortex/speechcortex-sdk"
"Bug Tracker" = "https://github.com/speechcortex/speechcortex-sdk/issues"
"Source Code" = "https://github.com/speechcortex/speechcortex-sdk"
Documentation = "https://github.com/speechcortex/speechcortex-sdk#readme"

[tool.setuptools.packages.find]
include = ["speechcortex*"]

[tool.setuptools.package-data]
speechcortex = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "speechcortex.version.__version__" }

######
# ruff configuration
######
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["deepgram-python-sdk"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # long lines in docstrings/comments are acceptable
]

######
# mypy configuration
######
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["deepgram-python-sdk", "build", "examples"]

######
# pytest configuration
######
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

######
# coverage configuration
######
[tool.coverage.run]
source = ["speechcortex"]
omit = ["speechcortex/helpers/microphone.py"]
